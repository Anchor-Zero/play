<!doctype html>
<html lang="ko" data-mood="attic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>할머니의 다락방</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Gaegu:wght@400;700&family=Song+Myung&family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@400;700;800&family=Poor+Story&display=swap">
<style>
/* engine.css — 구조·배치만. 색·글꼴·질감은 moods.css의 변수만 참조한다. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; }
html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  word-break: keep-all;
  overflow-wrap: break-word;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
img, svg { max-width: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { max-width: 520px; margin: 0 auto; min-height: 100vh; position: relative; display: flex; flex-direction: column; }
.screen { display: none; }
.screen.is-active { display: block; }

/* 버튼 */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 44px; min-width: 44px; padding: 8px 16px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--text);
  text-decoration: none; line-height: 1.2; gap: 6px;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.tile, .inv-item, .wheel-digit, .dir-display, .keypad-display { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-sm { min-height: 44px; padding: 4px 12px; font-size: 14px; }
.btn-icon { padding: 8px; }

/* ===== 시작 안내판 ===== */
.poster { padding: 32px 16px 40px; text-align: center; }
.poster.is-active { margin: auto 12px; }
.poster-title { font-size: 30px; line-height: 1.25; margin: 24px 0 12px; }
.poster-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; color: var(--text-dim); margin-bottom: 20px; }
.poster-stars { letter-spacing: 2px; }
.poster-stars .star { opacity: .35; }
.poster-stars .star.on { opacity: 1; color: var(--accent); }
.poster-intro { margin: 0 auto 28px; max-width: 32em; }
.poster-form { display: flex; flex-direction: column; gap: 12px; max-width: 320px; margin: 0 auto; }
.poster-form label { text-align: left; display: flex; flex-direction: column; gap: 6px; }
.poster-form input, .lock-text input, .field {
  width: 100%; min-height: 48px; padding: 8px 12px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--text);
}
.poster-resume { display: flex; flex-direction: column; gap: 12px; max-width: 320px; margin: 0 auto; }
.poster-resume .btn { width: 100%; }
.poster-note { color: var(--text-dim); font-size: 14px; margin: 0; }

/* ===== 방 화면 ===== */
.room.is-active { display: flex; flex-direction: column; min-height: 100vh; }
.topbar {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px; border-bottom: 1px solid var(--line);
  background: var(--bg-2); position: sticky; top: 0; z-index: 5;
}
.topbar-time { flex: 1 1 auto; min-width: 0; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.topbar-time.is-over { color: var(--bad); white-space: pre-line; font-size: 14px; line-height: 1.2; overflow: visible; text-overflow: clip; }
.topbar .btn { flex: 0 0 auto; min-height: 44px; padding: 6px 10px; font-size: 14px; white-space: nowrap; }
.hint-count { display: inline-block; min-width: 1.4em; text-align: center; padding: 0 4px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 13px; line-height: 1.4; }

.scenebar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
.scenebar .btn { flex: 0 0 auto; }
.scenebar-name { flex: 1 1 auto; text-align: center; font-size: 18px; font-weight: 600; min-width: 0; line-height: 1.2; }
.scenebar-name .topbar-room { display: block; font-size: 12px; font-weight: 400; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scenebar-dots { text-align: center; color: var(--text-dim); font-size: 12px; letter-spacing: 4px; margin-top: -4px; }

.scene { flex: 1 1 auto; padding: 8px 16px 16px; display: flex; flex-direction: column; justify-content: center; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.tile {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  min-height: 156px; padding: 14px 8px; position: relative;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--text); box-shadow: var(--shadow);
  text-align: center;
}
.tile .obj-icon { width: 80px; height: 80px; color: var(--text); }
.tile-visual { width: 112px; max-width: 100%; }
.tile-visual svg { display: block; width: 100%; height: auto; }
.tile-name { font-size: 15px; line-height: 1.3; }
.tile-badge { position: absolute; top: 6px; right: 8px; font-size: 12px; color: var(--text-dim); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; background: var(--bg-2); }
.tile.is-open .obj-icon { opacity: .55; }
.obj-icon { display: inline-block; vertical-align: middle; }

.invbar {
  position: sticky; bottom: 0; z-index: 5;
  border-top: 1px solid var(--line); background: var(--bg-2);
  padding: 8px 12px; min-height: 60px;
}
.invbar-label { font-size: 12px; color: var(--text-dim); margin: 0 0 4px; }
.invbar-list { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.invbar-empty { color: var(--text-dim); font-size: 14px; }
.inv-item { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 60px; padding: 4px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); font-size: 12px; }
.inv-item .obj-icon { width: 32px; height: 32px; }
.inv-item.is-new { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* ===== 겹쳐 뜨는 판(살펴보기·소지품·힌트·메뉴·도입) ===== */
.sheet {
  position: fixed; inset: 0; z-index: 20;
  display: flex; flex-direction: column;
  background: var(--bg); color: var(--text);
  max-width: 520px; margin: 0 auto;
}
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
.sheet-title { flex: 1 1 auto; min-width: 0; margin: 0; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px 32px; }
.sheet-foot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.sheet-foot .btn { flex: 1 1 auto; }

.examine-visual { display: flex; justify-content: center; margin: 0 auto 16px; max-width: 360px; }
.examine-visual svg, .examine-visual img { display: block; width: 100%; height: auto; }
.examine-visual .obj-icon { width: 160px; height: 160px; color: var(--text); }
.examine-text { margin: 0 0 16px; }
.examine-text p { margin: 0 0 8px; }
.paper { background: var(--paper); color: var(--ink); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.paper .hand, .hand { font-family: var(--font-hand); }
.paper h3 { margin: 0 0 12px; font-size: 20px; }
.paper p { margin: 0 0 8px; }
.prologue-text { font-size: 18px; line-height: 1.7; margin: 24px 0; }

/* ===== 자물쇠 ===== */
.lock { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); padding: 16px 12px; margin-top: 8px; }
.lock-title { margin: 0 0 12px; text-align: center; color: var(--text-dim); font-size: 14px; }
.lock-sticker { display: flex; justify-content: center; margin: 0 auto 12px; max-width: 220px; }
.lock-sticker svg { width: 100%; height: auto; }
.lock-actions { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.lock-actions .btn { flex: 1 1 120px; max-width: 220px; }
.lock-msg { text-align: center; min-height: 1.5em; margin: 8px 0 0; color: var(--bad); font-size: 14px; }
.lock.is-open .lock-msg { color: var(--ok); }
.lock-open-note { text-align: center; color: var(--text-dim); margin: 0; }

/* 숫자 휠 */
.wheels { display: flex; justify-content: center; gap: 10px; }
.wheel { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wheel .btn { min-width: 48px; min-height: 44px; padding: 4px; }
.wheel-digit { width: 48px; height: 56px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-variant-numeric: tabular-nums; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
@media (max-width: 374px) { .wheels { gap: 6px; } .wheel .btn, .wheel-digit { min-width: 44px; width: 44px; } }

/* 방향 */
.dir-display { min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 2px; flex-wrap: wrap; font-size: 22px; letter-spacing: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; margin-bottom: 12px; }
.dir-display:empty::before { content: "\00a0"; }
.dir-pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 6px; justify-content: center; }
.dir-pad .btn { font-size: 24px; min-width: 56px; min-height: 56px; padding: 0; }
.dir-pad .dir-u { grid-column: 2; grid-row: 1; }
.dir-pad .dir-l { grid-column: 1; grid-row: 2; }
.dir-pad .dir-r { grid-column: 3; grid-row: 2; }
.dir-pad .dir-d { grid-column: 2; grid-row: 3; }
.dir-pad .dir-c { grid-column: 2; grid-row: 2; font-size: 14px; }

/* 키패드 */
.keypad-display { min-height: 48px; display: flex; align-items: center; justify-content: center; font-size: 26px; letter-spacing: 6px; font-variant-numeric: tabular-nums; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; margin-bottom: 12px; }
.keypad-display:empty::before { content: "\00a0"; }
.keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 8px; justify-content: center; }
.keypad .btn { min-height: 52px; font-size: 22px; padding: 0; }
@media (max-width: 374px) { .keypad { grid-template-columns: repeat(3, 64px); } }

/* 글자 */
.lock-text { display: flex; flex-direction: column; gap: 10px; }

/* 연출 */
@keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
.lock.is-shake { animation: shake .4s; }
@keyframes clickpop { 0% { transform: scale(.7); opacity: 0; } 30% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
.click-fx { text-align: center; font-size: 28px; font-weight: 700; color: var(--ok); animation: clickpop .5s; margin: 8px 0; }
@keyframes toastin { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
.toast {
  position: fixed; left: 0; right: 0; top: 68px; margin: 0 auto; width: max-content; z-index: 50;
  max-width: calc(100% - 32px); padding: 10px 16px; border-radius: var(--radius);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: var(--surface); color: var(--text); border: 1px solid var(--line); box-shadow: var(--shadow);
  animation: toastin .25s; text-align: center; font-size: 15px; pointer-events: none;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ===== 힌트·메뉴 ===== */
.hint-step { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); margin-bottom: 10px; }
.hint-step-label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
.hint-note { color: var(--text-dim); margin: 0 0 12px; }
.hint-msg { font-size: 18px; text-align: center; margin: 24px 0; }
.menu-list { display: flex; flex-direction: column; gap: 10px; }
.menu-list .btn { width: 100%; }
.menu-info { color: var(--text-dim); font-size: 14px; margin: 0 0 16px; }
.menu-info dt { display: inline; font-weight: 600; color: var(--text); }
.menu-info dt::after { content: ":"; }
.menu-info dd { display: inline; margin: 0 0 0 4px; }
.menu-info div { margin-bottom: 4px; }

/* ===== 탈출 화면 ===== */
.escape { padding: 28px 16px 40px; text-align: center; }
.escape-title { font-size: 30px; margin: 8px 0 16px; }
.escape-ending { margin: 0 auto 20px; max-width: 32em; text-align: left; padding: 12px 16px; }
.escape-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; margin: 0 auto 20px; max-width: 360px; }
.escape-stats div { padding: 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.escape-stats dt { font-size: 12px; color: var(--text-dim); }
.escape-stats dd { margin: 0; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
.escape-card { margin: 0 auto 16px; max-width: 320px; }
.escape-card img { width: 100%; height: auto; display: block; border-radius: var(--radius); box-shadow: var(--shadow); }
.escape-card-note { font-size: 13px; color: var(--text-dim); margin: 6px 0 0; }
.escape-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; max-width: 360px; margin: 0 auto 16px; }
.escape-detail { text-align: left; max-width: 420px; margin: 0 auto 20px; padding: 12px 16px; }
.escape-detail h3 { font-size: 17px; margin: 16px 0 8px; }
.escape-detail table { width: 100%; border-collapse: collapse; font-size: 14px; }
.escape-detail th, .escape-detail td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.escape-detail td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.escape-reset { margin-top: 28px; }

</style>
<style>
/* FONT_LINK: https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Gaegu:wght@400;700&family=Song+Myung&family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@400;700;800&family=Poor+Story&display=swap */
/*
  moods.css — 분위기 묶음 4개 (attic, lab, cellar, library)
  규격 "접점"의 CSS 변수 19개를 묶음마다 전부 정의한다.
  색은 그 장소의 재료에서 가져왔다:
    attic   밤의 슬레이트 블루 벽 + 호두나무 + 놋쇠 + 낡은 크림색 종이
    lab     연녹색 타일 + 스테인리스 + 실험 노트의 옅은 초록 종이 + 약병 청록
    cellar  젖은 돌 + 촛농 + 불꽃 + 양피지
    library 오후 빛을 받은 황갈색 종이 + 오래된 책장 + 소가죽 표지 + 독서등 초록
  조명·질감은 body::before(질감)와 body::after(빛)로 넣되 둘 다 내용 뒤(z-index:-1)에 둔다.
  빛을 내용 위에 얹으면 글자 대비가 깎이므로(테스트 D1) 벽에만 비친다. 둘 다 pointer-events:none.
  prefers-reduced-motion이면 움직임을 끈다.
*/

/* ---------- 공통: 덧칠이 보이도록 바탕색은 html에, body는 투명 ---------- */
:root[data-mood] { background: var(--bg); }
:root[data-mood] body { background: transparent; }

:root[data-mood] body::before,
:root[data-mood] body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
}
:root[data-mood] body::before,
:root[data-mood] body::after  { z-index: -1; }

/* =====================================================================
   attic — 등잔불 켜진 따뜻한 다락방, 밤
   ===================================================================== */
:root[data-mood="attic"] {
  --bg: #1f2a36;          /* 밤의 슬레이트 블루 벽 */
  --bg-2: #161e28;        /* 벽의 그늘 */
  --surface: #4a3627;     /* 호두나무 */
  --surface-2: #5d4432;   /* 등잔불 받은 호두나무 */
  --line: #7a5a36;        /* 어둡게 바랜 놋쇠 테 */
  --accent: #c99a3e;      /* 놋쇠 */
  --on-accent: #2a1a0b;   /* 놋쇠 위 새긴 글씨 */
  --accent-2: #e2a862;    /* 등잔 불빛 */
  --text: #f1e5cc;        /* 불빛 받은 크림색 */
  --text-dim: #a99c86;    /* 그늘 속 글씨 */
  --paper: #ebdfc0;       /* 낡은 크림색 종이 */
  --ink: #3a2a1a;         /* 갈색 잉크 */
  --ok: #a9cf90;          /* 이끼 (호두나무 위 4.5:1) */
  --bad: #f7ad9e;         /* 등잔불 받은 녹 (호두나무 위 4.5:1) */
  --glow: rgba(255, 178, 84, 0.30);
  --font-ui: "Gowun Batang", "Noto Serif KR", "Noto Serif CJK KR", "AppleMyungjo", "Batang", "Apple SD Gothic Neo", "Malgun Gothic", serif;
  --font-hand: "Nanum Pen Script", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", cursive, sans-serif;
  --radius: 8px;
  --shadow: 0 12px 32px rgba(6, 10, 18, 0.55), 0 1px 0 rgba(255, 220, 170, 0.06) inset;
}
/* 벽: 가로 널빤지 결 + 네 귀의 어둠 */
:root[data-mood="attic"] body::before {
  background:
    radial-gradient(ellipse 120% 90% at 50% 40%, transparent 55%, rgba(5, 8, 14, 0.55) 100%),
    repeating-linear-gradient(180deg, transparent 0 54px, rgba(0, 0, 0, 0.16) 54px 56px),
    repeating-linear-gradient(90deg, rgba(255, 230, 190, 0.012) 0 3px, transparent 3px 7px);
}
/* 등잔: 오른쪽 위에서 비치는 빛, 아주 천천히 숨 쉰다 */
:root[data-mood="attic"] body::after {
  background:
    radial-gradient(ellipse 70% 55% at 92% -6%, var(--glow) 0%, rgba(255, 178, 84, 0.08) 40%, transparent 72%);
  animation: attic-breathe 7s ease-in-out infinite alternate;
}
@keyframes attic-breathe {
  from { opacity: 0.82; }
  to   { opacity: 1; }
}

/* =====================================================================
   lab — 형광등이 깜빡이는 차가운 실험실
   ===================================================================== */
:root[data-mood="lab"] {
  --bg: #dde4e1;          /* 연녹색 타일 벽 */
  --bg-2: #c7d1cd;        /* 타일의 그늘, 바닥 */
  --surface: #c4ced0;     /* 스테인리스 작업대 */
  --surface-2: #eaefed;   /* 흰 포마이카 */
  --line: #76868a;        /* 강철 모서리 */
  --accent: #125c69;      /* 약병 청록 */
  --on-accent: #eaf5f4;   /* 청록 위 흰 글씨 */
  --accent-2: #bf5f1c;    /* 위험 표지 주황 */
  --text: #141f26;        /* 검정 라벨 글씨 */
  --text-dim: #4b5a60;    /* 흐린 각인 */
  --paper: #e9efe5;       /* 실험 노트의 옅은 초록 종이 */
  --ink: #1c2a24;         /* 노트 잉크 */
  --ok: #125636;          /* 스테인리스 위 4.5:1 */
  --bad: #9a1c15;         /* 스테인리스 위 4.5:1 */
  --glow: rgba(215, 242, 236, 0.55);
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", sans-serif;
  --font-hand: "Gaegu", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", cursive, sans-serif;
  --radius: 2px;

<style>
/*
  poster.css — 시작 안내판(.poster)과 탈출 화면(.escape)의 장식. 색·테두리·글꼴·배경 효과만 다룬다.
  크기·간격·위치는 engine.css 몫이라 여기서는 padding/margin/width/font-size를 쓰지 않는다.
  (테두리는 1~2px로 얇게 두고, 두꺼운 테는 box-shadow inset으로 그려 배치에 영향을 주지 않는다.)
  인라인 순서: engine.css → moods.css → poster.css
*/

/* ---------- 공통 버튼 ---------- */
.btn {
  font-family: var(--font-ui);
  font-weight: 700;
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: filter 0.15s ease;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { filter: brightness(0.9); }
.btn:disabled { opacity: 0.5; cursor: default; filter: none; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn-primary {
  color: var(--on-accent);
  background: var(--accent);
  border-color: transparent;
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.28), 0 0 22px var(--glow);
}
.btn-primary:focus-visible { outline-color: var(--text); }

/* ---------- 시작 안내판: 매장 입구에 걸린 판 ---------- */
.poster {
  font-family: var(--font-ui);
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: inset 0 0 0 5px var(--surface), inset 0 0 0 6px var(--accent), var(--shadow);
}
.poster-title {
  font-family: var(--font-ui);
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
  text-shadow: 0 0 28px var(--glow);
}
.poster-meta { color: var(--text-dim); }
/* 꺼진 별도 보여야 "다섯 중 n개"로 읽힌다: 흐린 글자색, 엔진의 opacity는 되돌린다 (테스트 D5) */
.poster-stars .star { color: var(--text-dim); opacity: 1; }
.poster-stars .star.on { color: var(--accent); opacity: 1; }
.poster-intro { color: var(--text); }

.poster-form input {
  font-family: var(--font-ui);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  caret-color: var(--accent);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.18);
}
.poster-form input::placeholder { color: var(--ink); opacity: 0.5; }
.poster-form input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 이어서 하기: 판 아래에 끼워 둔 메모 */
.poster-resume {
  color: var(--text);
  background: var(--bg-2);
  border: 1px dashed var(--line);
  border-radius: var(--radius);
}

/* ---------- 탈출 화면 ---------- */
.escape { font-family: var(--font-ui); color: var(--text); }
.escape-title {
  font-family: var(--font-ui);
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
  text-shadow: 0 0 36px var(--glow), 0 0 8px var(--glow);
}
/* 결말 글: 종이 한 장 */
.escape-ending {
  font-family: var(--font-ui);
  color: var(--ink);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 32%), var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.escape-stats { color: var(--text-dim); }
.escape-stats b, .escape-stats strong { color: var(--text); font-weight: 700; }
.escape-card img {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  background: var(--bg-2);
}
.escape-detail {
  color: var(--text);
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.escape-detail b, .escape-detail strong { color: var(--accent); }

/* ---------- 분위기별 손질 ---------- */
/* 다락방: 나뭇결 판, 놋쇠 테 */
:root[data-mood="attic"] .poster {
  background:
    repeating-linear-gradient(180deg, rgba(0, 0, 0, 0) 0 21px, rgba(0, 0, 0, 0.14) 21px 23px),
    var(--surface);
}
/* 실험실: 흰 판, 위에 주황 경고 띠, 모서리 각지게 */
:root[data-mood="lab"] .poster {
  background: var(--surface-2);
  box-shadow: inset 0 6px 0 var(--accent-2), var(--shadow);
}
:root[data-mood="lab"] .poster-title { text-shadow: none; }
:root[data-mood="lab"] .btn-primary { box-shadow: 0 2px 0 rgba(0, 0, 0, 0.28); }
:root[data-mood="lab"] .escape-title { text-shadow: none; }
/* 지하실: 돌판, 안쪽에 어두운 홈, 글자에 촛불빛 */
:root[data-mood="cellar"] .poster {
  box-shadow: inset 0 0 0 3px var(--bg-2), inset 0 0 40px rgba(0, 0, 0, 0.55), var(--shadow);
}
:root[data-mood="cellar"] .poster-title,
:root[data-mood="cellar"] .escape-title { text-shadow: 0 0 30px var(--glow), 0 2px 0 rgba(0, 0, 0, 0.6); }
/* 도서관: 책 속표지처럼 두 줄 테 */
:root[data-mood="library"] .poster {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 5px var(--line), var(--shadow);
}
:root[data-mood="library"] .poster-title { text-shadow: none; }
:root[data-mood="library"] .escape-title { text-shadow: 0 0 30px var(--glow); }

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
}

<script>
/*
  card.js — 결과 기념 카드. drawCard(canvas, data, tokens) 하나를 전역으로 둔다.
  canvas 1080×1350. data = {title, genre, difficulty(1~5), limitMin, remainingSec(음수면 초과),
  hints, name, date(YYYY.MM.DD), mood}. tokens = 현재 분위기의 CSS 변수 값 객체.
  실제 매장에서 탈출한 팀이 들고 사진 찍는 기념 보드판을 흉내 낸다: 판 하나, 테두리, 큰 제목,
  남은 시간이 가장 크고, 아래에 손글씨 이름. 실패 판은 없다(탈출 화면은 항상 탈출한 상태).
*/
function drawCard(canvas, data, tokens) {
  data = data || {};
  tokens = tokens || {};
  var W = 1080, H = 1350;
  canvas.width = W;
  canvas.height = H;
  var ctx = canvas.getContext('2d');

  // ---- 토큰 읽기 (없으면 무난한 값) ----
  function tok(name, fallback) {
    var v = tokens[name];
    if (v == null) return fallback;
    v = String(v).trim();
    return v || fallback;
  }
  var C = {
    bg: tok('--bg', '#222'), bg2: tok('--bg-2', '#111'),
    surface: tok('--surface', '#444'), surface2: tok('--surface-2', '#555'),
    line: tok('--line', '#777'), accent: tok('--accent', '#c9a04a'),
    onAccent: tok('--on-accent', '#111'), accent2: tok('--accent-2', '#d08a40'),
    text: tok('--text', '#f2ead8'), textDim: tok('--text-dim', '#a9a090'),
    paper: tok('--paper', '#efe6cc'), ink: tok('--ink', '#2a2018'),
    bad: tok('--bad', '#b84a3a'), glow: tok('--glow', 'rgba(255,180,90,.3)')
  };
  var FONT_UI = tok('--font-ui', 'sans-serif');
  var FONT_HAND = tok('--font-hand', FONT_UI);
  var mood = String(data.mood || '');

  // 캔버스가 글꼴 스택을 못 읽으면 sans-serif로 물러난다
  function font(weight, size, stack) {
    var want = weight + ' ' + size + 'px ' + stack;
    ctx.font = '10px serif';
    ctx.font = want;
    if (ctx.font === '10px serif') ctx.font = weight + ' ' + size + 'px sans-serif';
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function star(cx, cy, r, on) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var rad = i % 2 ? r * 0.46 : r;
      var px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath();
    if (on) { ctx.fillStyle = C.accent; ctx.fill(); }
    else { ctx.lineWidth = 3; ctx.strokeStyle = C.line; ctx.stroke(); }
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function mmss(sec) {
    sec = Math.floor(Math.abs(sec));
    return pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60);
  }
  // 제목을 maxW 안에 넣는다: 한 줄(104px까지) → 두 줄(84px 이하) → 세 줄(64px 이하) 순으로 글자를 줄이고,
  // 52px에서도 세 줄에 안 들어가면 셋째 줄 끝을 말줄임표로 자른다. (테스트 D4)
  function fitTitle(text, maxW, startSize, minSize, weight) {
    for (var size = startSize; size >= minSize; size -= 4) {
      font(weight, size, FONT_UI);
      if (ctx.measureText(text).width <= maxW) return { size: size, lines: [text] };
      if (size <= 84) { var two = balance2(text, maxW); if (two) return { size: size, lines: two }; }
      if (size <= 64) { var many = greedy(text, maxW); if (many.length <= 3) return { size: size, lines: many }; }
    }
    font(weight, minSize, FONT_UI);
    var all = greedy(text, maxW);
    var lines = all.slice(0, 2);
    var rest = all.slice(2).join(text.indexOf(' ') >= 0 ? ' ' : '');
    lines.push(ellipsize(rest, maxW));
    return { size: minSize, lines: lines };
  }
  // 두 줄로 나눌 때는 양쪽 길이가 비슷해지는 자리에서 끊는다(띄어쓰기 우선, 없으면 글자 단위)
  function balance2(text, maxW) {
    var hasSpace = text.indexOf(' ') >= 0;
    var units = hasSpace ? text.split(' ') : text.split('');
    var joiner = hasSpace ? ' ' : '';
    var best = null;
    for (var i = 1; i < units.length; i++) {
      var a = units.slice(0, i).join(joiner), b = units.slice(i).join(joiner);
      var wa = ctx.measureText(a).width, wb = ctx.measureText(b).width;
      if (wa > maxW || wb > maxW) continue;
      var score = Math.abs(wa - wb);
      if (!best || score < best.score) best = { score: score, lines: [a, b] };
    }
    if (!best && hasSpace) return balance2(text.replace(/ /g, ''), maxW);  // 긴 단어 하나가 넘치면 글자 단위로
    return best ? best.lines : null;
  }
  // 앞에서부터 채워 여러 줄로. 단어 하나가 한 줄보다 길면 글자 단위로 쪼갠다
  function greedy(text, maxW) {
    var hasSpace = text.indexOf(' ') >= 0;
    var units = hasSpace ? text.split(' ') : text.split('');
    var joiner = hasSpace ? ' ' : '';
    var lines = [], cur = '';
    for (var j = 0; j < units.length; j++) {
      var u = units[j];
      if (ctx.measureText(u).width > maxW) {           // 너무 긴 단어: 글자로 쪼개 흘린다
        if (cur) { lines.push(cur); cur = ''; }
        var chars = u.split('');
        for (var k = 0; k < chars.length; k++) {
          if (ctx.measureText(cur + chars[k]).width <= maxW || !cur) cur += chars[k];
          else { lines.push(cur); cur = chars[k]; }
        }

      }
      var next = cur ? cur + joiner + u : u;

  // 한 줄에 안 들어가면 끝을 잘라 "…"를 붙인다

  function fitLine(text, maxW, startSize, minSize, weight, stack) {

  // ---- 바탕 ----
  ctx.fillStyle = C.bg;

  }

  // ---- 테두리: 분위기의 재료 ----

  ctx.clip();

    ctx.setLineDash([10, 8]); ctx.lineWidth = 2; ctx.strokeStyle = C.onAccent; ctx.globalAlpha = 0.75;

  }

    ctx.lineWidth = 3;
    ctx.strokeStyle = C.accent;
    ctx.globalAlpha = 0.9;
    rr(BX + BAND + 6, BY + BAND + 6, BW - (BAND + 6) * 2, BH - (BAND + 6) * 2, 6);

  /* ---------- 살펴보기 ---------- */

    var visual = o.sealed && o.sealed.visual ? unsealValue(o.sealed.visual, sealedKey) : o.visual;

  function giveItem(itemId) {

  function openedLockNote(id, o) {

    var rewards = normRewards(unsealValue(o.lock.sealed, key));

    rewards.forEach(function (r) { if (r.item && R.items[r.item]) names.push(R.items[r.item].name); });
    box.appendChild(h('p', { class: 'lock-open-note', text: '열려 있습니다.' + (names.length ? ' 안에 있던 것은 소지품에 넣었습니다: ' + names.join(', ') : '') }));
    return box;
  }
  function buildLock(id, o) {
    if (state.opened[id]) return openedLockNote(id, o);
    var lock = o.lock;
    var box = h('div', { class: 'lock', 'data-type': lock.type });
    if (lock.sticker) box.appendChild(h('div', { class: 'lock-sticker', html: lock.sticker }));
    var ui;
    if (lock.type === 'digits') ui = digitsUI(lock);
    else if (lock.type === 'direction') ui = directionUI(lock);
    else if (lock.type === 'keypad') ui = keypadUI(lock);

    box.appendChild(h('p', { class: 'lock-title', text: ui.title }));
    box.appendChild(ui.root);
    var msg = h('p', { class: 'lock-msg', 'aria-live': 'polite' });
    var actions = h('div', { class: 'lock-actions' });
    if (ui.needsButton) actions.appendChild(h('button', { class: 'btn btn-primary lock-open', type: 'button', text: '열어 보기', on: { click: function () { attempt(ui.getInput()); } } }));
    box.appendChild(actions);
    box.appendChild(msg);
    ui.onSubmit = function (raw) { attempt(raw); };
    function clearMsg(e) {
      var t = e && e.target && e.target.closest ? e.target.closest('[data-key="#"]') : null;
      if (t) return; // 키패드 #은 확인 키라 메시지를 지우지 않는다
      if (!state.opened[id]) msg.textContent = '';
    }
    ui.root.addEventListener('click', clearMsg);
    ui.root.addEventListener('input', clearMsg);

    function attempt(raw) {
      if (state.opened[id]) return;
      if (isEmptyInput(lock.type, raw)) { msg.textContent = '먼저 입력해 주세요'; return; } // E7: 빈 입력은 시도로 세지 않음
      var key = checkLock(lock, raw);
      if (!state.attempts[id]) state.attempts[id] = [];
      state.attempts[id].push({ input: normAnswer(lock.type, raw), at: now(), ok: !!key });
      if (!key) {
        save();
        box.classList.remove('is-shake');
        void box.offsetWidth;
        box.classList.add('is-shake');
        msg.textContent = '열리지 않습니다';
        vibrate(80);
        if (ui.onFail) ui.onFail();
        return;
      }
      // E1: 정답 판정과 같은 순간에 보상까지 상태에 반영하고 저장한다. 연출만 뒤에 한다.

  function isEmptyInput(type, raw) {

  function normRewards(r) {

  /* 보상을 상태에 반영한다(동기). 화면 연출은 presentRewards가 맡는다. */
  function applyRewards(o, key) {
    var rewards = normRewards(unsealValue(o.lock.sealed, key));
    var got = { items: [], revealed: [], next: null, escaped: false };
    rewards.forEach(function (r) {
      if (r.item && R.items[r.item] && state.items.indexOf(r.item) < 0) { state.items.push(r.item); got.items.push(r.item); }
      if (r.reveal && R.objects[r.reveal] && state.revealed.indexOf(r.reveal) < 0) { state.revealed.push(r.reveal); got.revealed.push(r.reveal); }
      if (r.nextRoom) {
        R.rooms.forEach(function (rm) { if (rm.id === r.nextRoom) got.next = rm; });
        if (got.next) { state.room = got.next.id; state.scene = 0; state.moves += 1; }
      }

  }
  function presentRewards(got) {

    got.revealed.forEach(function (rid) { toast('새로 나타났습니다: ' + R.objects[rid].name); });
    if (got.escaped) { setTimeout(function () { closeAllSheets(); showEscape(); }, 500); return; }
    if (got.next) {
      toast('다음 방으로 갑니다: ' + got.next.name);
      setTimeout(function () { closeAllSheets(); renderScene(); }, 700);
    }
  }

  /* 자물쇠 입력 장치들 */
  function digitsUI(lock) {
    var n = Math.max(1, Math.min(8, lock.length || 4));
    var digits = [];
    var root = h('div', { class: 'wheels' });
    for (var i = 0; i < n; i++) {
      digits.push(0);
      (function (idx) {
        var disp = h('div', { class: 'wheel-digit', text: '0', 'aria-label': (idx + 1) + '번째 자리' });
        var up = h('button', { class: 'btn wheel-up', type: 'button', 'aria-label': (idx + 1) + '번째 자리 올림', text: '▲', on: { click: function () { digits[idx] = (digits[idx] + 1) % 10; disp.textContent = digits[idx]; } } });
        var down = h('button', { class: 'btn wheel-down', type: 'button', 'aria-label': (idx + 1) + '번째 자리 내림', text: '▼', on: { click: function () { digits[idx] = (digits[idx] + 9) % 10; disp.textContent = digits[idx]; } } });
        root.appendChild(h('div', { class: 'wheel' }, up, disp, down));
      })(i);
    }
    return { root: root, title: n + '자리 숫자 자물쇠', needsButton: true, getInput: function () { return digits.join(''); } };
  }
  function directionUI(lock) {
    var seq = [];
    var disp = h('div', { class: 'dir-display', 'aria-live': 'polite', 'aria-label': '입력한 방향' });
    function redraw() { disp.textContent = seq.map(function (c) { return ARROW[c]; }).join(' '); }
    function push(c) { if (seq.length >= 12) return; seq.push(c); redraw(); }
    var pad = h('div', { class: 'dir-pad' },
      h('button', { class: 'btn dir-u', type: 'button', 'aria-label': '위', text: ARROW.U, on: { click: function () { push('U'); } } }),

    wrap.appendChild(h('h3', { text: '풀이 돌아보기' }));
    wrap.appendChild(h('div', { html: text ? paras(text) : '<p class="hint-note">풀이 글이 없습니다.</p>' }));
    return wrap;
  }

  /* ---------- 테스트용 손잡이 ---------- */
  window.escapeDebug = {
    setMood: function (name) {
      document.documentElement.setAttribute('data-mood', name);
      var esc_ = $('#escape');
      if (esc_ && esc_.classList.contains('is-active')) drawCardNow($('.escape-card img'), $('#escape-save'));
    },
    state: function () { return state; }
  };

  /* ---------- 시작 ---------- */
  function init() {
    document.documentElement.setAttribute('data-mood', R.mood || 'attic');
    document.title = R.title;
    app.innerHTML = '';
    app.appendChild(h('section', { class: 'poster screen', id: 'poster' }));
    app.appendChild(h('section', { class: 'room screen', id: 'room' }));
    app.appendChild(h('section', { class: 'escape screen', id: 'escape' }));
    state = load();
    render();
  }
  init();
})();

</script>
</body>
</html>
